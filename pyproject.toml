[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-comun"
version = "1.1.0"
description = "El marco común de la familia de studios PySide6: diseño claro/oscuro con acento, barra lateral, paleta de comandos, avisos, consola y workers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]
authors = [{ name = "Edison Achalma" }]

[project.urls]
Repositorio = "https://github.com/achalmed/gui-comun"

[tool.setuptools]
packages = ["gui_comun", "gui_comun.widgets", "gui_comun.workers"]
